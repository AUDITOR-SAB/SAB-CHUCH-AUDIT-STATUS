<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAB Mission — Audit Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07111f;--bg2:#0c1a2e;--bg3:#0f2040;
  --panel:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --blue:#1d6bf3;--blue2:#3b82f6;--sky:#60a5fa;--cyan:#22d3ee;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--gold:#f0b429;
  --purple:#8b5cf6;--pink:#ec4899;
  --white:#fff;--off:#e2eaff;--muted:#6b82a8;--muted2:#3d5070;
  --r:14px;--r2:10px;--sh:0 8px 32px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 900px 600px at -10% -10%,rgba(29,107,243,.12) 0%,transparent 70%),
  radial-gradient(ellipse 700px 500px at 110% 110%,rgba(240,180,41,.07) 0%,transparent 70%),
  radial-gradient(ellipse 500px 400px at 55% 50%,rgba(34,211,238,.04) 0%,transparent 60%)}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:56px 56px}
.page{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:rgba(7,17,31,.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.hdr{max-width:1500px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;flex-shrink:0}
.logo-img{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,rgba(29,107,243,.3),rgba(34,211,238,.2));border:1px solid rgba(255,255,255,.15);object-fit:contain;padding:5px}
.logo-fallback{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#1d6bf3,#22d3ee);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.logo-name{font-size:14px;font-weight:800;background:linear-gradient(120deg,#fff,var(--sky));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-tagline{font-size:10px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}
.hdr-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.yr-btn{padding:5px 13px;border-radius:18px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.yr-btn:hover{color:var(--white);border-color:var(--border2)}
.yr-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 14px rgba(29,107,243,.45)}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mode-toggle{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r2);padding:3px;gap:2px}
.mode-btn{padding:7px 16px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .22s;display:flex;align-items:center;gap:6px}
.mode-btn.on{background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;box-shadow:0 3px 12px rgba(29,107,243,.4)}
.mode-btn.son{background:linear-gradient(135deg,var(--gold),#d97706);color:#fff;box-shadow:0 3px 12px rgba(240,180,41,.4)}
.icon-btn{padding:7px 12px;border-radius:var(--r2);border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px}
.icon-btn:hover{color:var(--white);border-color:var(--border2)}

/* MAIN */
main{max-width:1500px;margin:0 auto;padding:32px 28px 80px;flex:1}

/* STATES */
.center-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;gap:14px;color:var(--muted);font-size:14px;text-align:center}
.spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.06);border-top-color:var(--blue2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* PAGE HEADER */
.page-header{margin-bottom:28px}
.mode-label{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px}
.lbl-c{background:rgba(29,107,243,.12);border:1px solid rgba(29,107,243,.25);color:var(--sky)}
.lbl-s{background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.25);color:var(--gold)}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(26px,3.5vw,42px);font-weight:700;line-height:1.1;margin-bottom:6px}
.page-title em{font-style:italic;font-weight:400}
.ac-blue{background:linear-gradient(120deg,var(--sky),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ac-gold{background:linear-gradient(120deg,var(--gold),#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-sub{color:var(--muted);font-size:13px}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;cursor:default}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.kpi.cb::before{background:linear-gradient(90deg,var(--blue2),transparent)}
.kpi.cg::before{background:linear-gradient(90deg,var(--green),transparent)}
.kpi.ca::before{background:linear-gradient(90deg,var(--amber),transparent)}
.kpi.cr::before{background:linear-gradient(90deg,var(--red),transparent)}
.kpi.co::before{background:linear-gradient(90deg,var(--gold),transparent)}
.kpi.cp::before{background:linear-gradient(90deg,var(--purple),transparent)}
.kpi-ic{font-size:20px;margin-bottom:8px}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.kpi-val{font-size:32px;font-weight:800;line-height:1;margin-bottom:3px}
.kpi.cb .kpi-val{color:var(--sky)}.kpi.cg .kpi-val{color:var(--green)}.kpi.ca .kpi-val{color:var(--amber)}.kpi.cr .kpi-val{color:var(--red)}.kpi.co .kpi-val{color:var(--gold)}.kpi.cp .kpi-val{color:var(--purple)}
.kpi-meta{font-size:11px;color:var(--muted)}
.kpi-bar{height:3px;background:rgba(255,255,255,.05);border-radius:2px;margin-top:11px;overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.34,1.56,.64,1)}
.kpi.cg .kpi-bar-fill{background:var(--green)}.kpi.ca .kpi-bar-fill{background:var(--amber)}.kpi.co .kpi-bar-fill{background:var(--gold)}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
.glh{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-bottom:20px}

/* CARD */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;position:relative;overflow:hidden}
.card-t{font-size:14px;font-weight:700;margin-bottom:3px}
.card-s{font-size:11px;color:var(--muted);margin-bottom:18px}

/* SEC TITLE */
.sec{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* DONUT */
.donut-area{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut-box{position:relative;width:160px;height:160px;flex-shrink:0}
.donut-box canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.d-pct{font-size:28px;font-weight:800;line-height:1}
.d-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:130px}
.li{display:flex;align-items:center;gap:9px;font-size:12px}
.ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ll{color:var(--muted);flex:1}
.lv{font-weight:700}
.lp{font-size:11px;color:var(--muted2)}

/* BAR LIST */
.bar-list{display:flex;flex-direction:column;gap:13px}
.brow{display:flex;flex-direction:column;gap:5px}
.bhdr{display:flex;justify-content:space-between;align-items:baseline}
.bname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.bstat{font-size:11px;color:var(--muted)}
.btrack{height:7px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.bfill{height:100%;border-radius:4px;transition:width 1.3s cubic-bezier(.34,1.56,.64,1)}

/* STATUS PILLS */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%}
.pa{background:rgba(16,185,129,.13);color:#34d399}.pa::before{background:#10b981;box-shadow:0 0 5px #10b981}
.pw{background:rgba(245,158,11,.13);color:#fbbf24}.pw::before{background:#f59e0b;animation:blink 1.6s infinite}
.pp{background:rgba(239,68,68,.13);color:#fca5a5}.pp::before{background:#ef4444}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* BANK BADGES */
.bb{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.ba{background:rgba(16,185,129,.12);color:#34d399}.bd{background:rgba(245,158,11,.12);color:#fbbf24}
.bc{background:rgba(96,165,250,.12);color:#93c5fd}.bn{background:rgba(239,68,68,.1);color:#fca5a5}

/* WILAYAH CARDS */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:24px}
.wcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px;cursor:pointer;transition:all .2s}
.wcard:hover,.wcard.act{border-color:rgba(59,130,246,.45);background:rgba(59,130,246,.06);transform:translateY(-1px)}
.wcard.act{box-shadow:0 0 0 1px rgba(59,130,246,.3)}
.wname{font-size:13px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.wstats{display:flex;gap:14px;margin-bottom:10px}
.ws{display:flex;flex-direction:column;gap:1px}
.wsv{font-size:17px;font-weight:800;line-height:1}
.wsl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.wprog{height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.wfill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width 1.2s ease}
.wpct{font-size:10px;color:var(--muted);text-align:right;margin-top:4px}

/* BANK ROWS */
.bkrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.bkrow:last-child{border-bottom:none}
.bkct{font-weight:800}

/* TABLE */
.tbl-ctrl{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.srch{flex:1;min-width:180px;position:relative}
.srch input{width:100%;padding:8px 12px 8px 34px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r2);color:var(--white);font-family:inherit;font-size:12px;outline:none;transition:border-color .2s}
.srch input:focus{border-color:var(--blue2)}
.srch input::placeholder{color:var(--muted)}
.sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.flt{padding:8px 11px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r2);color:var(--white);font-family:inherit;font-size:12px;outline:none;cursor:pointer}
.flt option{background:#0c1a2e}
.twrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:11px 14px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--white)}
tbody tr{border-bottom:1px solid var(--border);transition:background .14s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.025)}
td{padding:11px 14px;color:var(--off);white-space:nowrap}
.tfund{font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}

/* PAGINATION */
.pgn{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);flex-wrap:wrap;gap:8px}
.pbtns{display:flex;gap:4px}
.pbtn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s}
.pbtn:hover{color:var(--white);border-color:var(--border2)}
.pbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pbtn:disabled{opacity:.3;cursor:not-allowed}

/* SCHOOL CARDS */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-bottom:24px}
.scard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:22px;transition:all .2s;position:relative;overflow:hidden}
.scard::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(240,180,41,.07),transparent 70%);pointer-events:none}
.scard:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:rgba(240,180,41,.25)}
.stop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sname{font-size:14px;font-weight:800;line-height:1.3}
.spic{font-size:11px;color:var(--muted);margin-top:3px}
.sdiv{height:1px;background:var(--border);margin:12px 0}
.srow{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:7px}
.srow:last-child{margin-bottom:0}
.slbl{color:var(--muted)}

/* FUND LEADERS */
.frow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border);font-size:12px;margin-bottom:6px}
.fnum{color:var(--muted);font-size:11px;font-weight:800;width:18px;flex-shrink:0}
.fname{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fval{font-weight:800;color:var(--gold);white-space:nowrap}

/* CHART */
.cw{position:relative;width:100%}
.cw canvas{display:block;width:100%!important}

/* FOOTER */
footer{text-align:center;padding:16px;font-size:11px;color:var(--muted2);border-top:1px solid var(--border)}

/* ANIM */
.fade-in{animation:fi .45s ease both}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media(max-width:1100px){.g2,.g3,.glh{grid-template-columns:1fr}}
@media(max-width:768px){
  .hdr{padding:0 16px;height:auto;flex-wrap:wrap;padding:12px 16px;gap:10px}
  .hdr-mid{display:none}
  main{padding:20px 14px 60px}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  td{padding:9px 10px}
}
@media(max-width:480px){.kpi-row{grid-template-columns:1fr 1fr}.sgrid{grid-template-columns:1fr}.wgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="hdr">
    <a class="logo" href="#">
      <img src="SDA-LOGO.png" alt="SAB" class="logo-img" onerror="this.style.display='none';document.getElementById('lf').style.display='flex'">
      <div id="lf" class="logo-fallback" style="display:none">SAB</div>
      <div style="display:flex;flex-direction:column;gap:1px">
        <span class="logo-name">SAB Mission</span>
        <span class="logo-tagline">Audit Dashboard</span>
      </div>
    </a>
    <div class="hdr-mid" id="yrSel"></div>
    <div class="hdr-right">
      <button class="icon-btn" onclick="doRefresh()">↻ Refresh</button>
      <div class="mode-toggle">
        <button class="mode-btn on" id="btnC" onclick="setMode('church')">⛪ Church</button>
        <button class="mode-btn" id="btnS" onclick="setMode('school')">🏫 School</button>
      </div>
    </div>
  </div>
</header>

<main id="main">
  <div class="center-state"><div class="spin"></div><div>Loading data from Google Sheets…</div></div>
</main>

<footer id="ft" style="display:none">
  SAB Mission Audit Dashboard &nbsp;·&nbsp; Last updated: <span id="ftT"></span>
</footer>
</div>

<script>
/* ─── CONFIG ─── */
const CHURCH_ID = '1Kw04DaAB0AG1mrv_nqrXuHmbYVdvJ1b8DKZkRYBCIyo';
const SCHOOL_ID = '1JmzWY0wpXu6GXMdtXRRQjO_PpOH0oHiNRjPA5BBlrUU';
const YEARS = [2023,2024,2025,2026];
const PAL = ['#3b82f6','#10b981','#f0b429','#ef4444','#8b5cf6','#ec4899','#22d3ee','#f97316','#a3e635','#fb7185','#06b6d4','#84cc16'];

/* ─── STATE ─── */
const S = {
  mode:'church', year:2025,
  cData:{}, sData:{},
  search:'', fSt:'', fWil:'',
  page:1, perPage:25, sc:-1, sd:1,
  charts:{},
};

/* ─── FETCH via PapaParse CSV export ─── */
function csvUrl(id, tab){
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&cb=${Date.now()}`;
}

function fetchCSV(id, tab){
  return new Promise((ok,fail)=>{
    Papa.parse(csvUrl(id,tab),{
      download:true, header:true, skipEmptyLines:true,
      transformHeader:h=>h.trim(),
      transform:v=>v.trim(),
      complete:r=>ok(r.data.filter(row=>Object.values(row).some(v=>v!==''))),
      error:e=>fail(e),
    });
  });
}

async function loadAll(){
  document.getElementById('main').innerHTML='<div class="center-state"><div class="spin"></div><div>Loading data from Google Sheets…</div></div>';
  const tabs = {'2023':'2023','2024':'2024','2025':'2025','2026':'2026'};
  for(const yr of YEARS){
    try{ S.cData[yr]=await fetchCSV(CHURCH_ID,tabs[yr]); }catch(e){ S.cData[yr]=[]; }
    try{ S.sData[yr]=await fetchCSV(SCHOOL_ID,tabs[yr]); }catch(e){ S.sData[yr]=[]; }
  }
  renderAll();
}

async function doRefresh(){ destroyCharts(); S.cData={}; S.sData={}; await loadAll(); }

/* ─── HELPERS ─── */
// 💡 NEW ROBUST GETTER: This searches your columns even if there are spaces or capitalization differences
function getVal(row, ...keys) {
  const rKeys = Object.keys(row);
  for (let k of keys) {
    const kl = k.toLowerCase().trim();
    const match = rKeys.find(rk => rk.toLowerCase().trim().includes(kl));
    if (match && row[match] !== undefined) return row[match].toString().trim();
  }
  return '';
}

function cur(){ return S.mode==='church'?(S.cData[S.year]||[]):(S.sData[S.year]||[]); }

function getSt(r){
  const v = getVal(r, 'status');
  if(/audit/i.test(v)) return 'Audited';
  if(/work.in.progress|wip/i.test(v)) return 'WIP';
  if(/pending/i.test(v)) return 'Pending';
  return v||'Pending';
}

function getBank(r){
  return getVal(r, 'bank record', 'bank') || 'No data';
}

function getFund(r){
  const raw = getVal(r, 'closing fund balance', 'fund balance', 'fund', 'balance');
  const n = parseFloat(raw.replace(/[^0-9.-]/g,''));
  return isNaN(n)?null:n;
}

function fRM(n){
  if(n===null||n===undefined||n===0) return n===0?'RM 0.00':'—';
  return 'RM '+n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function pill(s){
  const m={Audited:'pa',WIP:'pw',Pending:'pp'};
  const lbl=s==='WIP'?'Work in Progress':s;
  return `<span class="pill ${m[s]||'pp'}">${lbl}</span>`;
}

function bank(b){
  let c='bn';
  if(/active/i.test(b)) c='ba';
  else if(/dormant/i.test(b)) c='bd';
  else if(/cash/i.test(b)) c='bc';
  return `<span class="bb ${c}">${b}</span>`;
}

function uniq(rows,key){ 
  return [...new Set(rows.map(r=>getVal(r, key)).filter(Boolean))].sort(); 
}

function stats(rows){
  const t=rows.length;
  const a=rows.filter(r=>getSt(r)==='Audited').length;
  const w=rows.filter(r=>getSt(r)==='WIP').length;
  const p=rows.filter(r=>getSt(r)==='Pending').length;
  const bk={};
  rows.forEach(r=>{ const b=getBank(r); bk[b]=(bk[b]||0)+1; });
  const fund=rows.reduce((acc,r)=>acc+(getFund(r)||0),0);
  return{t,a,w,p,pct:t?Math.round(a/t*100):0,bk,fund};
}

function wilStats(rows){
  const m={};
  rows.forEach(r=>{
    const w=getVal(r, 'wilayah')||'Unknown';
    if(!m[w]) m[w]={t:0,a:0,w:0,p:0,fund:0};
    m[w].t++;
    const s=getSt(r);
    if(s==='Audited') m[w].a++;
    else if(s==='WIP') m[w].w++;
    else m[w].p++;
    const f=getFund(r); if(f) m[w].fund+=f;
  });
  return Object.entries(m).map(([n,d])=>({n,...d,pct:d.t?Math.round(d.a/d.t*100):0})).sort((a,b)=>b.t-a.t);
}

function daerStats(rows){
  const m={};
  rows.forEach(r=>{
    const d=getVal(r, 'daerah')||'Unknown';
    if(!m[d]) m[d]={t:0,a:0};
    m[d].t++;
    if(getSt(r)==='Audited') m[d].a++;
  });
  return Object.entries(m).map(([n,d])=>({n,...d,pct:d.t?Math.round(d.a/d.t*100):0})).sort((a,b)=>b.t-a.t).slice(0,15);
}

function trends(){
  return YEARS.map(yr=>{
    const rows=S.mode==='church'?(S.cData[yr]||[]):(S.sData[yr]||[]);
    const s=stats(rows);
    return{yr,t:s.t,a:s.a,pct:s.pct};
  });
}

  }
  if(S.fSt) filt=filt.filter(r=>getSt(r)===S.fSt);
  if(S.fWil) filt=filt.filter(r=>getVal(r,'wilayah')===S.fWil);
  if(S.sc>=0){
    const k=COLS[S.sc];
    let searchKey = k;
    if (k === 'Closing Fund Balance') searchKey = 'fund';
    if (k === 'Bank Record') searchKey = 'bank';
    filt=[...filt].sort((a,b)=>{
      const av=getVal(a, searchKey).toLowerCase(),bv=getVal(b, searchKey).toLowerCase();
      return av<bv?-S.sd:av>bv?S.sd:0;
    });
  }
  const tot=filt.length, pages=Math.max(1,Math.ceil(tot/S.perPage)), pg=Math.min(S.page,pages);
  const slice=filt.slice((pg-1)*S.perPage,pg*S.perPage);
  const sa=i=>S.sc===i?(S.sd===1?'↑':'↓'):'';

  const pNums=[]; const used=new Set();
  for(let i=1;i<=pages;i++){
    if(pages<=7||i===1||i===pages||Math.abs(i-pg)<=1){pNums.push(i);used.add(i);}
    else if(Math.abs(i-pg)===2&&!used.has('…')){pNums.push('…');used.add('…');}
  }

  return `

  <div class="srch"><span class="sic">🔍</span>
    <input type="text" placeholder="Search church, daerah, wilayah…" value="${S.search}" oninput="S.search=this.value;S.page=1;renderAll()">

  <select class="flt" onchange="S.fSt=this.value;S.page=1;renderAll()">
    <option value="">All Status</option>
    <option value="Audited"${S.fSt==='Audited'?' selected':''}>Audited</option>
    <option value="WIP"${S.fSt==='WIP'?' selected':''}>WIP</option>
    <option value="Pending"${S.fSt==='Pending'?' selected':''}>Pending</option>
  </select>
  <span style="font-size:11px;color:var(--muted)">${tot} record${tot!==1?'s':''}</span>
</div>
<div class="twrap">
  <table>
    <thead><tr>${COLS.map((c,i)=>`<th onclick="srt(${i})">${c} ${sa(i)}</th>`).join('')}</tr></thead>
    <tbody>
    ${slice.length?slice.map(r=>`<tr>
      <td style="color:var(--sky);font-weight:600">${getVal(r,'wilayah')||'—'}</td>
      <td>${getVal(r,'daerah')||'—'}</td>
      <td style="font-weight:700">${getVal(r,'gereja')||'—'}</td>
      <td style="color:var(--muted)">${getVal(r,'type')||'—'}</td>
      <td>${bank(getBank(r))}</td>
      <td class="tfund">${fRM(getFund(r))}</td>
      <td>${pill(getSt(r))}</td>
    </tr>`).join(''):'<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted);font-style:italic">No records found</td></tr>'}
    </tbody>
  </table>
  ${pages>1?`<div class="pgn">
    <span>${(pg-1)*S.perPage+1}–${Math.min(pg*S.perPage,tot)} of ${tot}</span>
    <div class="pbtns">
      <button class="pbtn" onclick="S.page=Math.max(1,S.page-1);renderAll()" ${pg===1?'disabled':''}>‹</button>
      ${pNums.map(n=>n==='…'?`<button class="pbtn" disabled>…</button>`:`<button class="pbtn${n===pg?' on':''}" onclick="S.page=${n};renderAll()">${n}</button>`).join('')}
      <button class="pbtn" onclick="S.page=Math.min(${pages},S.page+1);renderAll()" ${pg===pages?'disabled':''}>›</button>
    </div>
  </div>`:''}
</div>`;
}

    datasets:[
      {label:'Audited %',data:tr.map(t=>t.pct),borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.1)',fill:true,tension:.4,pointBackgroundColor:'#10b981',pointRadius:4,pointHoverRadius:6,borderWidth:2},
      {label:'Total',data:tr.map(t=>t.t),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.06)',fill:true,tension:.4,yAxisID:'y2',pointBackgroundColor:'#3b82f6',pointRadius:3,borderWidth:2,borderDash:[4,3]}
    ]
  },options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
    animation:{duration:800},
    scales:{
      y:{min:0,max:100,ticks:{color:'#6b82a8',font:{size:10},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,.04)'}},
      y2:{position:'right',min:0,ticks:{color:'#6b82a8',font:{size:10}},grid:{display:false}},
      x:{ticks:{color:'#6b82a8',font:{size:10}},grid:{display:false}}
    },
    plugins:{legend:{position:'bottom',labels:{color:'#6b82a8',font:{size:10},boxWidth:10,padding:10}},tooltip:TT}
  }});
}

function bWil(wil){
  if(!wil.length) return;
  const top=wil.slice(0,10);
  mkChart('cWil',{type:'bar',data:{
    labels:top.map(w=>w.n),
    datasets:[
      {label:'Audited',data:top.map(w=>w.a),backgroundColor:'rgba(16,185,129,.8)',stack:'s'},
      {label:'WIP',data:top.map(w=>w.w),backgroundColor:'rgba(245,158,11,.8)',stack:'s'},
      {label:'Pending',data:top.map(w=>w.p),backgroundColor:'rgba(239,68,68,.8)',stack:'s'},
    ]
  },options:{responsive:true,maintainAspectRatio:false,animation:{duration:800},
    scales:{
      x:{stacked:true,ticks:{color:'#6b82a8',font:{size:9},maxRotation:40},grid:{display:false}},
      y:{stacked:true,ticks:{color:'#6b82a8',font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}}
    },
    plugins:{legend:{position:'bottom',labels:{color:'#6b82a8',font:{size:10},boxWidth:10,padding:8}},tooltip:{...TT,stacked:true}}
  }});
}

function bFund(rows){
  const key=S.mode==='church'?'gereja':'school';
  const data=rows.map(r=>({n:getVal(r, key)||'—',f:getFund(r)}))
    .filter(d=>d.f!==null&&d.f>0).sort((a,b)=>b.f-a.f).slice(0,8);
  if(!data.length) return;
  mkChart('cFund',{type:'bar',data:{
    labels:data.map(d=>d.n),
    datasets:[{label:'Fund Balance',data:data.map(d=>d.f),backgroundColor:data.map((_,i)=>PAL[i%PAL.length]+'bb'),borderColor:data.map((_,i)=>PAL[i%PAL.length]),borderWidth:1,borderRadius:4}]
  },options:{responsive:true,maintainAspectRatio:false,animation:{duration:800},
    scales:{
      x:{ticks:{color:'#6b82a8',font:{size:9},maxRotation:40},grid:{display:false}},
      y:{ticks:{color:'#6b82a8',font:{size:9},callback:v=>'RM'+v.toLocaleString()},grid:{color:'rgba(255,255,255,.04)'}}
    },
    plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:ctx=>'RM '+ctx.raw.toLocaleString('en-MY',{minimumFractionDigits:2})}}}
  }});
}

function bSchool(rows){
  const names=rows.map(r=>getVal(r, 'school')||'—');
  const sts=rows.map(r=>getSt(r));
  const stMap={Audited:100,WIP:50,Pending:0};
  const stCol={Audited:'rgba(16,185,129,.8)',WIP:'rgba(245,158,11,.8)',Pending:'rgba(239,68,68,.8)'};
  mkChart('cSchSt',{type:'bar',data:{
    labels:names,
    datasets:[{label:'Progress',data:sts.map(s=>stMap[s]??0),backgroundColor:sts.map(s=>stCol[s]||'rgba(239,68,68,.8)'),borderRadius:5,borderSkipped:false}]
  },options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:{duration:800},
    scales:{
      x:{min:0,max:100,ticks:{color:'#6b82a8',font:{size:9},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,.04)'}},
      y:{ticks:{color:'#6b82a8',font:{size:10}},grid:{display:false}}
    },
    plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:ctx=>sts[ctx.dataIndex]==='WIP'?'Work in Progress':sts[ctx.dataIndex]}}}
  }});
  const fdata=rows.map(r=>({n:getVal(r, 'school')||'—',f:getFund(r)||0}));
  mkChart('cSchFd',{type:'bar',data:{
    labels:fdata.map(d=>d.n),
    datasets:[{label:'Fund',data:fdata.map(d=>d.f),backgroundColor:PAL.slice(0,fdata.length).map(c=>c+'bb'),borderColor:PAL.slice(0,fdata.length),borderWidth:1,borderRadius:5,borderSkipped:false}]
  },options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:{duration:800},
    scales:{
      x:{ticks:{color:'#6b82a8',font:{size:9},callback:v=>'RM'+v.toLocaleString()},grid:{color:'rgba(255,255,255,.04)'}},
      y:{ticks:{color:'#6b82a8',font:{size:10}},grid:{display:false}}
    },
    plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:ctx=>'RM '+ctx.raw.toLocaleString('en-MY',{minimumFractionDigits:2})}}}
  }});
}

/* ─── ANIMATE ─── */
function animB(){
  document.querySelectorAll('.bfill,.wfill,.kpi-bar-fill').forEach(el=>{
    const w=el.style.width; el.style.width='0';
    requestAnimationFrame(()=>setTimeout(()=>{ el.style.width=w; },20));
  });
}

function aniPct(id,target){
  const el=document.getElementById(id);
  if(!el) return;
  let c=0;
  const step=()=>{ if(c<target){c++;el.textContent=c+'%';requestAnimationFrame(step);}else el.textContent=target+'%'; };
  step();
}

/* ─── CONTROLS ─── */
function setMode(m){
  S.mode=m; S.search=''; S.fSt=''; S.fWil=''; S.page=1;
  document.getElementById('btnC').className='mode-btn'+(m==='church'?' on':'');
  document.getElementById('btnS').className='mode-btn'+(m==='school'?' son':'');
  renderAll();
}

function setYear(y){ S.year=y; S.page=1; S.search=''; S.fSt=''; S.fWil=''; renderAll(); }
function srt(col){ if(S.sc===col) S.sd*=-1; else{S.sc=col;S.sd=1;} renderAll(); }

function fwil(w){
  S.fWil=S.fWil===w?'':w; S.page=1; renderAll();
  setTimeout(()=>{ const t=document.querySelector('.twrap'); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); },120);
}

function escQ(s){ return s.replace(/'/g,"\\'"); }

/* ─── BOOT ─── */
renderYrs();
loadAll();
</script>
</body>
</html>
